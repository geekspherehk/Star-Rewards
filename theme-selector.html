<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择主题 - Star Rewards 儿童积分奖励系统</title>
    <meta name="description" content="选择 Star Rewards 主题：经典版、卷娃模式（儿童激励）、卷自己模式（个人自律），多种积分奖励风格随心切换。">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://stellar.gaocaihk.com/theme-selector.html">
    <link rel="stylesheet" href="i18n.css?v=1">
    <!-- 多语言支持 -->
    <script defer src="i18n.js?v=17"></script>
    <script>
        window.addEventListener('load', function() {
            initLanguage();
        });
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'SF Pro Display', 'Helvetica Neue', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            text-align: center;
        }

        .header {
            margin-bottom: 60px;
            animation: fadeInDown 1s ease;
        }

        .header h1 {
            font-size: 3rem;
            color: white;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
        }

        .themes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .theme-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .theme-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .theme-card:hover::before {
            left: 100%;
        }

        .theme-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .theme-card.original {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.95), rgba(118, 75, 162, 0.95));
            color: white;
        }

        .theme-card.juanwa {
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.95), rgba(255, 152, 0, 0.95));
            color: #333;
        }

        .theme-card.juanziji {
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.95), rgba(15, 52, 96, 0.95));
            color: white;
        }

        .theme-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }

        .theme-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .theme-description {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
            opacity: 0.9;
        }

        .theme-features {
            text-align: left;
            margin-bottom: 25px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .feature-icon {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        .theme-button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: inherit;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .theme-button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .quick-access {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .quick-access h3 {
            color: white;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .quick-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .quick-link {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .quick-link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.2rem;
            }
            
            .header p {
                font-size: 1.1rem;
            }
            
            .themes-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .theme-card {
                padding: 30px 20px;
            }
            
            .quick-links {
                flex-direction: column;
                align-items: center;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .theme-card {
            animation: fadeInUp 0.8s ease;
        }

        .theme-card:nth-child(1) { animation-delay: 0.1s; }
        .theme-card:nth-child(2) { animation-delay: 0.2s; }
        .theme-card:nth-child(3) { animation-delay: 0.3s; }
    </style>
</head>
<body>
    <div class="language-selector">
        <select id="language-selector" onchange="setLanguage(this.value)">
            <option value="zh">中文</option>
            <option value="en">English</option>
        </select>
    </div>
    
    <div class="container">
        <div class="header">
            <h1>🌟 <span data-i18n="theme.title">选择你的主题</span></h1>
            <p data-i18n="theme.subtitle">选择一个适合你的激励方式，开启成长之旅</p>
        </div>

        <div class="themes-grid">
            <!-- 原版主题 -->
            <a href="index.html" class="theme-card original">
                <span class="theme-icon">⭐</span>
                <h2 class="theme-title" data-i18n="theme.original.name">经典版</h2>
                <p class="theme-description" data-i18n="theme.original.desc">简洁实用的积分奖励系统</p>
                <div class="theme-features">
                    <div class="feature-item">
                        <span class="feature-icon">✨</span>
                        <span>简洁优雅的界面设计</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">📊</span>
                        <span>完整的积分管理功能</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">🎁</span>
                        <span>灵活的礼物兑换系统</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">📈</span>
                        <span>详细的历史记录追踪</span>
                    </div>
                </div>
                <button class="theme-button">进入经典版 →</button>
            </a>

            <!-- 卷娃主题 -->
            <a href="index.html?theme=juanwa" class="theme-card juanwa">
                <span class="theme-icon">👶</span>
                <h2 class="theme-title" data-i18n="theme.juanwa.name">卷娃小能手</h2>
                <p class="theme-description" data-i18n="theme.juanwa.desc">专为儿童成长设计的激励系统</p>
                <div class="theme-features">
                    <div class="feature-item">
                        <span class="feature-icon">🌈</span>
                        <span>儿童友好的界面设计</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">🎨</span>
                        <span>温暖明亮的色彩搭配</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">🏆</span>
                        <span>宝贝愿望和成长日记</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">💝</span>
                        <span>温馨的亲子互动体验</span>
                    </div>
                </div>
                <button class="theme-button">进入卷娃模式 →</button>
            </a>

            <!-- 卷自己主题 -->
            <a href="index.html?theme=juanziji" class="theme-card juanziji">
                <span class="theme-icon">💪</span>
                <h2 class="theme-title" data-i18n="theme.juanziji.name">卷自己</h2>
                <p class="theme-description" data-i18n="theme.juanziji.desc">成年人自律打卡，成就更好的自己</p>
                <div class="theme-features">
                    <div class="feature-item">
                        <span class="feature-icon">⚡</span>
                        <span>能量值替代积分概念</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">🎯</span>
                        <span>目标奖励和成就系统</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">📊</span>
                        <span>成长轨迹记录分析</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">🔥</span>
                        <span>自律任务打卡功能</span>
                    </div>
                </div>
                <button class="theme-button">进入卷自己模式 →</button>
            </a>
        </div>

        <div class="quick-access">
            <h3>快速访问</h3>
            <div class="quick-links">
                <a href="index.html" class="quick-link">经典版</a>
                <a href="index.html?theme=juanwa" class="quick-link">卷娃模式</a>
                <a href="index.html?theme=juanziji" class="quick-link">卷自己模式</a>
            </div>
        </div>
    </div>

    <script defer src="api/api-client.js?v=18"></script>
    <script defer src="themes.js?v=1"></script>
    <script>
        // Handle theme card clicks
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.theme-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(30px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.6s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 200);

                card.addEventListener('click', async function(e) {
                    e.preventDefault();
                    
                    let themeName;
                    if (card.classList.contains('original')) {
                        themeName = 'classic';
                    } else if (card.classList.contains('juanwa')) {
                        themeName = 'juanwa';
                    } else if (card.classList.contains('juanziji')) {
                        themeName = 'juanziji';
                    }
                    
                    if (themeName) {
                        // Add click animation
                        card.style.transform = 'scale(0.98)';
                        setTimeout(() => {
                            card.style.transform = 'translateY(-10px) scale(1.02)';
                        }, 150);

                        // Save theme and go
                        localStorage.setItem('selectedTheme', themeName);
                        
                        // Persist to API if logged in
                        if (typeof api !== 'undefined' && api.getToken()) {
                            try {
                                await api.updateTheme(themeName);
                            } catch (e) {
                                // Non-critical - localStorage fallback already set
                            }
                        }
                        
                        setTimeout(() => {
                            window.location.href = 'index.html?theme=' + themeName;
                        }, 300);
                    }
                });
            });
        });
    </script>
</body>
</html>
