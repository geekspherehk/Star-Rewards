<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stellar · 本周打卡表海报合成器（原型）</title>
<style>
  :root{
    --bg:#F4F5F9; --surface:#fff; --surface-2:#FAFAFC;
    --border:#E5E7EF; --border-strong:#D3D6E3;
    --text:#1B1D29; --text-2:#5B6076; --text-3:#8B90A6;
    --brand:#5B5BD6; --brand-soft:#EEEDFF; --accent:#F5A524;
    --paper:#FBF1E4; --ink:#22306B; --pink:#EE5C7D; --gold:#F7C948; --gold-d:#DFA318;
    --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
    --sh-sm:0 1px 2px rgba(20,24,50,.06),0 2px 8px rgba(20,24,50,.05);
    --sh-md:0 8px 28px rgba(20,24,50,.12);
    --fzh:"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    --font:"Arial Rounded MT Bold","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fzh);
       display:flex;gap:20px;padding:20px;align-items:flex-start;flex-wrap:wrap}
  .side{flex:0 0 268px;display:flex;flex-direction:column;gap:14px;position:sticky;top:20px}
  .stage{flex:1 1 420px;min-width:320px;display:flex;flex-direction:column;gap:14px;align-items:center}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
        box-shadow:var(--sh-sm);padding:16px}
  h1{font-size:16px;margin:0 0 2px;font-family:var(--font)}
  .hint{font-size:12px;color:var(--text-3);margin:0;line-height:1.6}
  label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin:12px 0 6px}
  label:first-of-type{margin-top:0}
  input[type=text],select{width:100%;padding:9px 11px;border:1px solid var(--border-strong);
        border-radius:var(--r-sm);font-family:inherit;font-size:13px;background:var(--surface-2);color:var(--text)}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{flex:1 1 0;min-width:60px;width:auto;padding:8px 6px;border:1px solid var(--border-strong);
        background:var(--surface-2);border-radius:var(--r-sm);font-family:inherit;font-size:12px;
        color:var(--text-2);cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:700}
  .btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .btns button{padding:11px;border-radius:var(--r-sm);border:1px solid var(--border-strong);
        background:var(--surface-2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--text)}
  .btns button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btns button.ghost{background:transparent}
  .row{display:flex;gap:8px}
  .row button{flex:1}
  #previewWrap{background:#E9EAF0;border-radius:var(--r-lg);padding:16px;display:flex;justify-content:center;width:100%}
  canvas{width:100%;max-width:380px;height:auto;border-radius:12px;box-shadow:var(--sh-md);background:#fff}
  .meta{font-size:12px;color:var(--text-3);text-align:center;margin:0}
  .badge{display:inline-block;padding:2px 8px;border-radius:var(--r-pill);background:var(--brand-soft);
         color:var(--brand);font-size:11px;font-weight:700;margin-right:6px}
  @media (max-width:820px){.side{position:static;flex:1 1 100%}}
</style>
</head>
<body>

<aside class="side">
  <div class="card">
    <h1>海报合成器</h1>
    <p class="hint">AI 出美术底图，代码叠真实数据。改任何一项都会实时重画。</p>

    <label>背景底图</label>
    <div class="seg" id="segBg">
      <button data-v="A" aria-pressed="false">A 靠右</button>
      <button data-v="B" aria-pressed="false">B 居中</button>
      <button data-v="C" aria-pressed="true">C 升级版</button>
    </div>

    <label>孩子名字</label>
    <input type="text" id="nameInput" value="小明" maxlength="8">

    <label>本周起算（周日）</label>
    <input type="text" id="dateInput" value="2026-09-27">

    <label>模拟「今天」是周几</label>
    <select id="todaySel">
      <option value="0">周日</option><option value="1">周一</option>
      <option value="2">周二</option><option value="3">周三</option>
      <option value="4">周四</option><option value="5">周五</option>
      <option value="6" selected>周六</option>
    </select>

    <label>星标颜色</label>
    <div class="seg" id="segStar">
      <button data-v="gold" aria-pressed="true">纸感金</button>
      <button data-v="brand" aria-pressed="false">品牌靛蓝</button>
    </div>

    <label>语言</label>
    <div class="seg" id="segLang">
      <button data-v="zh" aria-pressed="true">中文</button>
      <button data-v="en" aria-pressed="false">English</button>
    </div>

    <div class="btns">
      <button class="primary" id="btnDl">下载本周海报 PNG</button>
      <button id="btnBlank">下载空白模板（免登录引流用）</button>
      <button class="ghost" id="btnCopy">复制到剪贴板</button>
    </div>
  </div>

  <div class="card">
    <p class="hint"><span class="badge">合成</span>底图是 AI 生成的美术层；标题、名字、日期、格子、星星、奖励、二维码全部是 canvas 画的。生产环境再叠真实打卡数据即可。</p>
  </div>
</aside>

<main class="stage">
  <div id="previewWrap"><canvas id="cv" width="1024" height="1536"></canvas></div>
  <p class="meta" id="meta">—</p>
</main>

<script src="../qrcode-generator.js"></script>
<script>
/* ============================================================
   Stellar 本周打卡表 · 海报合成器（原型）
   美术层(AI 底图 + AI 图标) + 数据层(canvas)  1024x1536
   ============================================================ */

var W = 1024, H = 1536;

/* ---------- 素材 ---------- */
/* 几何值均由 scripts/slice_ai_icon_sheet.py + 像素扫描实测得出 */
var BG = {
  A: { src:'ai-assets/Keep_this_exact_poster_layout__2026-09-27T04-27-27.png',
       titleMode:'left', panel:{x:92, y:551, w:838, h:563},
       tiles:{y:1184, h:196, w:174, xs:[101,320,538,757]},
       strip:{x:128,y:1387,w:767,h:83},
       sticker:{x:856,y:1470,w:158,h:58} },
  B: { src:'ai-assets/Tall_vertical_children_s_poste_2026-09-27T04-26-02.png',
       titleMode:'strip', panel:{x:92, y:614, w:836, h:500},
       tiles:{y:1184, h:196, w:174, xs:[101,320,538,757]},
       strip:{x:130,y:1392,w:770,h:78},
       sticker:{x:856,y:1470,w:158,h:58} },
  /* C = 升级版：主角更大更居中（双手举星）、左右对称丝带、面板更干净 */
  C: { src:'ai-assets/Tall_vertical_children_s_rewar_2026-09-27T13-40-02.png',
       titleMode:'banner',
       panel:{x:78, y:690, w:866, h:460, padTop:56},
       header:{x:256, y:662, w:528, h:74},
       ribbons:{L:{cx:200, cy:350, w:212, h:104}, R:{cx:840, cy:350, w:212, h:104}},
       tiles:{y:1190, h:190, w:192, xs:[80,304,528,752]},
       strip:{x:272,y:1412,w:480,h:68},
       sticker:{x:852,y:1458,w:162,h:66} }
};

var ICON_SRC = {
  brush:'ai-assets/icons/brush.png', water:'ai-assets/icons/water.png',
  book:'ai-assets/icons/book.png',   heart:'ai-assets/icons/heart.png',
  moon:'ai-assets/icons/moon.png',   ball:'ai-assets/icons/ball.png',
  bag:'ai-assets/icons/bag.png',     plant:'ai-assets/icons/plant.png'
};

var imgs = { bg:{}, icon:{} };

/* ---------- 文案 ---------- */
var STR = {
  zh:{
    eyebrow:'STELLAR · WEEKLY', h1:'本周打卡表', of:'的小目标',
    done:'本周已点亮', unit:'颗星', tasks:'任务',
    rewards:['讲个故事','公园撒欢','挑今晚的菜'],
    rewardCost:['10','20','30'],
    qr:'扫码一起打卡', qrSub:'家长共用一本',
    brand:'STELLAR', tag:'让好习惯被看见',
    days:['日','一','二','三','四','五','六'],
    footer:'扫码记录你家孩子的习惯'
  },
  en:{
    eyebrow:'STELLAR · WEEKLY', h1:'Weekly Tracker', of:"'s goals",
    done:'Stars earned', unit:'stars', tasks:'TASKS',
    rewards:['Story Time','Park Fun','Pick Dinner'],
    rewardCost:['10','20','30'],
    qr:'Scan to join', qrSub:'share with family',
    brand:'STELLAR', tag:'Good habits, seen',
    days:['S','M','T','W','T','F','S'],
    footer:'Scan to track your child\u2019s habits'
  }
};

/* ---------- 演示数据（真实环境来自 api.getWishes / getCheckins） ---------- */
var HABITS = [
  {icon:'brush', zh:'早晚刷牙',       en:'Brush Teeth'},
  {icon:'water', zh:'喝足 6 杯水',    en:'Drink Water'},
  {icon:'book',  zh:'阅读 20 分钟',   en:'Reading 20 min'},
  {icon:'bag',   zh:'自己整理书包',   en:'Pack My Bag'},
  {icon:'moon',  zh:'9 点前上床',     en:'Sleep On Time'}
];
/* 状态: done=已打卡 / miss=漏了可补 / today=今天待打卡 / future=还没到 / before=目标建立前 */
function stateOf(hi, di, today){
  if (di > today) return 'future';
  if (hi === 0 && di === 0) return 'before';          // 目标那天才建立
  var seed = (hi * 7 + di * 3) % 10;
  if (di === today) return seed < 5 ? 'done' : 'today';
  return seed < 7 ? 'done' : 'miss';
}

/* ---------- 画布工具 ---------- */
function rr(ctx,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function shadow(ctx, color, blur, dy){
  ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetY = dy || 0;
}
function noShadow(ctx){ ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0; }

/* 五角星：外接圆半径 R，内半径 R*f */
function starPath(ctx,cx,cy,R,f){
  ctx.beginPath();
  for (var i=0;i<10;i++){
    var ang = -Math.PI/2 + i*Math.PI/5;
    var r = (i%2) ? R*f : R;
    var px = cx + r*Math.cos(ang), py = cy + r*Math.sin(ang);
    i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
  }
  ctx.closePath();
}
function hex2rgba(hex,a){
  var n = parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function fitText(ctx, text, maxW, startPx, minPx){
  var px = startPx;
  while (px > minPx && ctx.measureText(text).width > maxW) { px -= 1; ctx.font = ctx.font.replace(/\d+(\.\d+)?px/, px+'px'); }
  return px;
}

/* ---------- 主绘制 ---------- */
function draw(opts){
  var o = opts || {};
  var lang = o.lang || 'zh', T = STR[lang];
  var bgKey = o.bg || 'A', cfg = BG[bgKey];
  var starColor = o.star === 'brand' ? '#5B5BD6' : '#F7C948';
  var starEdge  = o.star === 'brand' ? '#4342B8' : '#DFA318';
  var name = o.name || (lang==='zh'?'小明':'Mia');
  var today = o.today == null ? 6 : o.today;
  var blank = !!o.blank;

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);

  /* 1. AI 美术底图 */
  var bg = imgs.bg[bgKey];
  if (bg) ctx.drawImage(bg, 0, 0, W, H);
  else { ctx.fillStyle='#FBF1E4'; ctx.fillRect(0,0,W,H); }

  /* 2. 标题区 */
  ctx.textBaseline = 'alphabetic';
  if (cfg.titleMode === 'left'){
    var tx = 58, tw = 356;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#E9919F';
    ctx.font = '700 19px "Arial Rounded MT Bold","PingFang SC",sans-serif';
    if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '2.5px';
    ctx.fillText(T.eyebrow, tx, 132);
    if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '0px';

    ctx.fillStyle = '#22306B';
    ctx.font = '700 62px "Arial Rounded MT Bold","PingFang SC",sans-serif';
    ctx.fillText(T.h1, tx, 205);

    ctx.font = '700 40px "Arial Rounded MT Bold","PingFang SC",sans-serif';
    var nmW = ctx.measureText(blank ? (lang==='zh'?'＿＿＿':'______') : name).width;
    ctx.fillStyle = '#ED5B7C';
    ctx.fillText(blank ? (lang==='zh'?'＿＿＿':'______') : name, tx, 265);
    ctx.fillStyle = '#22306B';
    ctx.font = '700 30px "Arial Rounded MT Bold","PingFang SC",sans-serif';
    ctx.fillText(T.of, tx + nmW + 4, 265);

    ctx.fillStyle = '#B08663';
    ctx.font = '600 23px "PingFang SC",sans-serif';
    ctx.fillText(blank ? '____ / ____' : dateRange(o.date, lang), tx + 2, 308);

    /* 3. 左侧「本周已点亮」统计卡 */
    var stat = blank ? {done:0,total:HABITS.length*7} : computeStat(today);
    var hx=tx-2, hy=340, hw=344, hh=126;
    ctx.save();
    shadow(ctx,'rgba(120,90,60,.16)',22,8);
    ctx.fillStyle='#fff'; rr(ctx,hx,hy,hw,hh,26); ctx.fill(); noShadow(ctx);
    ctx.fillStyle='#9C8B7A';
    ctx.font='600 20px "PingFang SC",sans-serif';
    ctx.fillText(T.done, hx+26, hy+38);
    ctx.fillStyle='#22306B';
    ctx.font='700 54px "Arial Rounded MT Bold","PingFang SC",sans-serif';
    var numStr = blank ? '＿＿' : String(stat.done);
    ctx.fillText(numStr, hx+26, hy+92);
    var nw = ctx.measureText(numStr).width;
    ctx.fillStyle='#C0AE9B';
    ctx.font='700 24px "PingFang SC",sans-serif';
    ctx.fillText('/ ' + (blank ? '＿＿' : stat.total) + ' ' + T.unit, hx+34+nw, hy+90);
    /* 进度条 */
    var px0=hx+26, py0=hy+hh-30, pw=hw-52, ph=13;
    ctx.fillStyle='#F1E4D6'; rr(ctx,px0,py0,pw,ph,ph/2); ctx.fill();
    var pr = blank ? 0.03 : Math.max(0.04, stat.done/Math.max(1,stat.total));
    var g = ctx.createLinearGradient(px0,0,px0+pw,0);
    g.addColorStop(0,'#F6A8B8'); g.addColorStop(1, starColor);
    ctx.fillStyle=g; rr(ctx,px0,py0,Math.max(ph,pw*pr),ph,ph/2); ctx.fill();
    ctx.restore();
  }

  /* 2b. banner 版式：标题写进面板顶部粉色头带；名字写左丝带、日期写右丝带 */
  if (cfg.titleMode === 'banner'){
    var HD = cfg.header;
    ctx.save();
    ctx.textAlign='center';
    ctx.fillStyle='#B0496A';
    var hfs = 34;
    ctx.font='700 '+hfs+'px "Arial Rounded MT Bold","PingFang SC",sans-serif';
    hfs = fitText(ctx, T.h1, HD.w - 56, hfs, 22);
    ctx.fillText(T.h1, HD.x + HD.w/2, HD.y + HD.h/2 + hfs*0.36);
    ctx.restore();

    if (cfg.ribbons){
      var RL = cfg.ribbons.L, RR = cfg.ribbons.R;
      ctx.save();
      ctx.textAlign='center';
      /* 左丝带：孩子名字 */
      ctx.fillStyle='#B9607A';
      var nfs = 40;
      ctx.font='700 '+nfs+'px "Arial Rounded MT Bold","PingFang SC",sans-serif';
      var nmTxt = blank ? (lang==='zh'?'＿＿':'_ _') : name;
      nfs = fitText(ctx, nmTxt, RL.w - 54, nfs, 20);
      ctx.fillText(nmTxt, RL.cx, RL.cy + nfs*0.36);
      /* 右丝带：本周日期 */
      ctx.fillStyle='#A98A6B';
      var dfs = 24;
      ctx.font='700 '+dfs+'px "Arial Rounded MT Bold","PingFang SC",sans-serif';
      var dtTxt = blank ? '____ / ____' : dateRangeShort(o.date, lang);
      dfs = fitText(ctx, dtTxt, RR.w - 48, dfs, 13);
      ctx.fillText(dtTxt, RR.cx, RR.cy + dfs*0.36 + 2);
      ctx.restore();
    }
  }

  /* 4. 表格面板 */
  var P = cfg.panel;
  var padX = 24, padY = 22, padTop = (P.padTop == null ? padY : P.padTop);
  var cx0 = P.x + padX, cy0 = P.y + padTop;
  var cw = P.w - padX*2, ch = P.h - padTop - padY;

  if (cfg.titleMode === 'strip'){
    ctx.save();
    ctx.textAlign='center';
    ctx.fillStyle='#B9607A';
    ctx.font='700 30px "Arial Rounded MT Bold","PingFang SC",sans-serif';
    ctx.fillText(T.h1 + ' · ' + (blank ? '____' : name), W/2, P.y - 22);
    ctx.restore();
  }

  var labelW = 262, headH = 58;
  var colW = (cw - labelW) / 7;
  var rowsTop = cy0 + headH;
  var rowsH = ch - headH;
  var n = HABITS.length;
  var rowH = Math.min(84, rowsH / n);
  var usedH = rowH * n;
  var startY = rowsTop + Math.max(0, (rowsH - usedH)/2);

  /* 4a. 表头：7 天 */
  ctx.textAlign='center';
  for (var d=0; d<7; d++){
    var dcx = cx0 + labelW + colW*(d+0.5);
    var dcy = cy0 + headH/2 + 2;
    var isToday = (d === today) && !blank;
    ctx.beginPath();
    ctx.arc(dcx, dcy, 24, 0, Math.PI*2);
    ctx.fillStyle = isToday ? '#ED5B7C' : '#F6EFE5';
    ctx.fill();
    ctx.fillStyle = isToday ? '#fff' : '#8A7A68';
    ctx.font = '700 22px "PingFang SC",sans-serif';
    ctx.fillText(T.days[d], dcx, dcy + 8);
  }
  /* 表头左侧角标 */
  ctx.textAlign='left';
  ctx.fillStyle='#B5A491';
  ctx.font='700 20px "PingFang SC",sans-serif';
  ctx.fillText(T.tasks, cx0 + 10, cy0 + headH/2 + 7);

  /* 4b. 行 */
  var chips = ['#DDF0E2','#FCE1E8','#E6E0F8','#FCEFC7','#D9E9F8','#F6E1D8','#E2EFD9'];
  for (var i=0;i<n;i++){
    var hyy = startY + i*rowH;
    /* 行底：淡色圆角卡 */
    var chip = chips[i % chips.length];
    ctx.fillStyle = hex2rgba('#FFFFFF', 0.72);
    rr(ctx, cx0, hyy+5, cw, rowH-10, 20); ctx.fill();
    /* 左侧任务卡 */
    var chipW = labelW - 16, chipH = rowH - 22, chipX = cx0 + 8, chipY = hyy + 11;
    ctx.fillStyle = chip;
    rr(ctx, chipX, chipY, chipW, chipH, 16); ctx.fill();
    /* 图标（白底盘保证在浅彩底上可辨） */
    var isz = Math.min(46, rowH-30);
    ctx.fillStyle = 'rgba(255,255,255,.78)';
    rr(ctx, chipX+7, hyy + (rowH-isz-12)/2, isz+12, isz+12, 13); ctx.fill();
    var ic = imgs.icon[HABITS[i].icon];
    if (ic) ctx.drawImage(ic, chipX+13, hyy + (rowH-isz)/2, isz, isz);
    /* 任务名 */
    ctx.textAlign='left';
    ctx.fillStyle='#22306B';
    var fs = Math.min(23, Math.max(16, rowH-40));
    var label = lang==='zh' ? HABITS[i].zh : HABITS[i].en;
    var tx0 = chipX + isz + 21;
    ctx.font = '700 '+fs+'px "PingFang SC",sans-serif';
    fs = fitText(ctx, label, chipX + chipW - 14 - tx0, fs, 13);
    ctx.fillText(label, tx0, hyy + rowH/2 + fs*0.36);

    /* 7 天格 */
    for (var d2=0; d2<7; d2++){
      var cxx = cx0 + labelW + colW*(d2+0.5);
      var cyy = hyy + rowH/2;
      var st = blank ? 'empty' : stateOf(i, d2, today);
      var R  = Math.min(21, rowH*0.28);

      /* 极淡格线 */
      ctx.strokeStyle = 'rgba(215,198,178,.55)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(cx0 + labelW + colW*d2, hyy+12);
      ctx.lineTo(cx0 + labelW + colW*d2, hyy+rowH-12);
      ctx.stroke();

      if (st === 'done'){
        ctx.save();
        shadow(ctx, hex2rgba(starEdge,.45), 10, 4);
        starPath(ctx, cxx, cyy+1, R, 0.46);
        ctx.fillStyle = starColor; ctx.fill(); noShadow(ctx);
        ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.6; ctx.stroke();
        /* 高光 */
        ctx.beginPath();
        ctx.ellipse(cxx - R*0.28, cyy - R*0.36, R*0.26, R*0.16, -0.5, 0, Math.PI*2);
        ctx.fillStyle='rgba(255,255,255,.75)'; ctx.fill();
        ctx.restore();
      } else if (st === 'miss'){
        starPath(ctx, cxx, cyy, R, 0.46);
        ctx.strokeStyle = '#E3C9A4'; ctx.lineWidth = 2.6; ctx.stroke();
      } else if (st === 'today'){
        rr(ctx, cxx-R-5, cyy-R-5, (R+5)*2, (R+5)*2, 12);
        ctx.strokeStyle = '#ED5B7C'; ctx.lineWidth = 2.6;
        ctx.setLineDash([6,5]); ctx.stroke(); ctx.setLineDash([]);
        starPath(ctx, cxx, cyy, R*0.86, 0.46);
        ctx.strokeStyle = '#F0B7C6'; ctx.lineWidth = 2.2; ctx.stroke();
      } else if (st === 'future'){
        ctx.beginPath();
        ctx.arc(cxx, cyy, 3.2, 0, Math.PI*2);
        ctx.fillStyle = '#EDE1D2'; ctx.fill();
      } else if (st === 'before'){
        ctx.beginPath();
        ctx.arc(cxx, cyy, 4.5, 0, Math.PI*2);
        ctx.fillStyle = '#E7E1D8'; ctx.fill();
      } else { /* blank 模板 */
        starPath(ctx, cxx, cyy, R, 0.46);
        ctx.strokeStyle = '#EBD7BC'; ctx.lineWidth = 2.4; ctx.stroke();
      }
    }
  }

  /* 5. 底部 3 张奖励卡 + 二维码卡
        口径：整块盖住 AI 的粉彩色块，自带粉彩顶帽，避免错位露边 */
  var T3 = cfg.tiles;
  var tY = T3.y, tH = T3.h, tW = T3.w;
  var tileIcons = ['book','ball','heart'];
  var capColors = ['#FBD3DF','#C9E8D6','#DED6F5','#FBE7A8'];
  ctx.textAlign='center';
  for (var t=0;t<4;t++){
    var tX = T3.xs[t];
    var capH = 62;
    /* 白卡 */
    ctx.save();
    shadow(ctx,'rgba(120,90,60,.13)',14,5);
    ctx.fillStyle='#FFFDF9'; rr(ctx,tX,tY,tW,tH,26); ctx.fill(); noShadow(ctx);
    ctx.restore();
    /* 粉彩顶帽（只保留上两角圆角） */
    ctx.fillStyle = capColors[t];
    ctx.save();
    rr(ctx,tX,tY,tW,capH+26,26); ctx.clip();
    ctx.fillRect(tX, tY, tW, capH);
    ctx.restore();

    if (t < 3){
      var ti = imgs.icon[tileIcons[t]];
      if (ti) ctx.drawImage(ti, tX + tW/2 - 23, tY + 9, 46, 46);
      /* 星数药丸 */
      var pw2 = 74, ph2 = 30, px2 = tX + (tW-pw2)/2, py2 = tY + capH + 12;
      ctx.fillStyle='#F7F1E8'; rr(ctx,px2,py2,pw2,ph2,ph2/2); ctx.fill();
      ctx.fillStyle = starColor;
      starPath(ctx, px2+20, py2+15, 10, 0.46); ctx.fill();
      ctx.fillStyle='#22306B';
      ctx.font='700 19px "Arial Rounded MT Bold","PingFang SC",sans-serif';
      ctx.textAlign='left';
      ctx.fillText(T.rewardCost[t], px2+35, py2+22);
      ctx.textAlign='center';
      /* 名称 */
      var rl = T.rewards[t];
      var rfs = 16;
      ctx.fillStyle='#5E5148';
      ctx.font='700 '+rfs+'px "PingFang SC",sans-serif';
      rfs = fitText(ctx, rl, tW-24, rfs, 11);
      ctx.fillText(rl, tX + tW/2, tY + tH - 22);
    } else {
      /* 二维码卡 */
      var box = 104, ox = tX + (tW-box)/2, oy = tY + capH + 6;
      try {
        var url = 'https://stellar.gaocaihk.com';
        var qr = qrcode(0,'M'); qr.addData(url); qr.make();
        var mc = qr.getModuleCount();
        var m = box/mc;
        ctx.fillStyle='#22306B';
        for (var r2=0;r2<mc;r2++) for (var c2=0;c2<mc;c2++)
          if (qr.isDark(r2,c2)) ctx.fillRect(ox+c2*m, oy+r2*m, Math.ceil(m), Math.ceil(m));
      } catch(e){
        ctx.strokeStyle='#D9CDBE'; ctx.setLineDash([5,5]); ctx.lineWidth=2;
        rr(ctx, ox, oy, box, box, 10); ctx.stroke(); ctx.setLineDash([]);
      }
      ctx.fillStyle='#5E5148';
      ctx.font='700 14px "PingFang SC",sans-serif';
      ctx.fillText(T.qr, tX + tW/2, oy + box + 20);
    }
  }

  /* 6. 底部粉色条 */
  var S = cfg.strip;
  var compact = S.w < 640;              /* 窄粉条只放「品牌 · 网址」 */
  ctx.save();
  var scy = S.y + S.h/2;
  if (compact){
    ctx.textAlign='center';
    ctx.fillStyle='#B9607A';
    ctx.font='700 21px "Arial Rounded MT Bold","PingFang SC",sans-serif';
    if (ctx.letterSpacing !== undefined) ctx.letterSpacing='1.5px';
    ctx.fillText(T.brand + '  \u00b7  stellar.gaocaihk.com', S.x + S.w/2, scy + 8);
    if (ctx.letterSpacing !== undefined) ctx.letterSpacing='0px';
  } else {
    ctx.textAlign='left';
    ctx.fillStyle='#B9607A';
    ctx.font='700 22px "Arial Rounded MT Bold","PingFang SC",sans-serif';
    if (ctx.letterSpacing !== undefined) ctx.letterSpacing='2px';
    ctx.fillText(T.brand, S.x+10, scy + 8);
    if (ctx.letterSpacing !== undefined) ctx.letterSpacing='0px';
    ctx.textAlign='center';
    ctx.fillStyle='#22306B';
    ctx.font='700 25px "Arial Rounded MT Bold","PingFang SC",sans-serif';
    ctx.fillText('stellar.gaocaihk.com', W/2 + 10, scy + 9);
    ctx.textAlign='right';
    ctx.fillStyle='#C0798F';
    ctx.font='700 19px "PingFang SC",sans-serif';
    ctx.fillText(T.tag, S.x + S.w - 8, scy + 7);
  }
  ctx.restore();

  /* 7. 盖掉底图右下角的水印，做成一枚品牌贴纸 */
  var C = cfg.sticker;
  ctx.save();
  shadow(ctx,'rgba(120,90,60,.10)',12,4);
  ctx.fillStyle = '#FFFDF9';
  rr(ctx, C.x, C.y, C.w, C.h, 20); ctx.fill(); noShadow(ctx);
  ctx.strokeStyle = '#F2D8D0'; ctx.lineWidth = 1.6;
  rr(ctx, C.x, C.y, C.w, C.h, 20); ctx.stroke();
  ctx.restore();
  ctx.textAlign='center';
  ctx.fillStyle='#C79AA6';
  ctx.font='700 17px "Arial Rounded MT Bold","PingFang SC",sans-serif';
  ctx.fillText('STELLAR \u2661', C.x + C.w/2, C.y + C.h/2 + 6);

  /* 8. 供外部读取的统计 */
  var st2 = blank ? {done:0,total:HABITS.length*7} : computeStat(today);
  return { done:st2.done, total:st2.total };
}

/* 统计：只数「目标建立之后」的应打卡次数 */
function computeStat(today){
  var done=0, total=0;
  for (var i=0;i<HABITS.length;i++){
    for (var d=0; d<=today; d++){
      var st = stateOf(i, d, today);
      if (st === 'before') continue;
      total++;
      if (st === 'done') done++;
    }
  }
  return {done:done, total:total};
}

function dateRange(iso, lang){
  var d = new Date((iso || '2026-09-27') + 'T00:00:00');
  if (isNaN(d.getTime())) d = new Date();
  var e = new Date(d.getTime() + 6*864e5);
  var f = function(x){ return x.getMonth()+1; }, g = function(x){ return x.getDate(); };
  if (lang === 'en'){
    var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return M[d.getMonth()] + ' ' + g(d) + ' \u2013 ' + M[e.getMonth()] + ' ' + g(e) + ', ' + e.getFullYear();
  }
  return f(d) + '月' + g(d) + '日 \u2014 ' + f(e) + '月' + g(e) + '日';
}

/* 丝带用的短日期：9/27–10/3 或 Sep 27–Oct 3 */
function dateRangeShort(iso, lang){
  var d = new Date((iso || '2026-09-27') + 'T00:00:00');
  if (isNaN(d.getTime())) d = new Date();
  var e = new Date(d.getTime() + 6*864e5);
  if (lang === 'en'){
    var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return M[d.getMonth()] + ' ' + d.getDate() + '\u2013' + M[e.getMonth()] + ' ' + e.getDate();
  }
  return (d.getMonth()+1) + '/' + d.getDate() + '\u2013' + (e.getMonth()+1) + '/' + e.getDate();
}

/* ---------- 素材加载 ---------- */
function loadImg(src){
  return new Promise(function(res){
    var im = new Image();
    im.onload = function(){ res(im); };
    im.onerror = function(){ res(null); };
    im.src = src;
  });
}
function loadAll(){
  var jobs = [];
  Object.keys(BG).forEach(function(k){
    jobs.push(loadImg(BG[k].src).then(function(im){ imgs.bg[k] = im; }));
  });
  Object.keys(ICON_SRC).forEach(function(k){
    jobs.push(loadImg(ICON_SRC[k]).then(function(im){ imgs.icon[k] = im; }));
  });
  return Promise.all(jobs);
}

/* ---------- 交互 ---------- */
var state = { bg:'C', lang:'zh', star:'gold', today:6, name:'小明', date:'2026-09-27', blank:false };

function bindSeg(id, key, after){
  var box = document.getElementById(id);
  box.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    [].forEach.call(box.querySelectorAll('button'), function(x){
      x.setAttribute('aria-pressed', String(x === b));
    });
    state[key] = b.dataset.v;
    if (after) after();
    render();
  });
}
function bindInput(id, key){
  document.getElementById(id).addEventListener('input', function(e){
    state[key] = e.target.value;
    render();
  });
}
function setSeg(id, val){
  var box = document.getElementById(id);
  [].forEach.call(box.querySelectorAll('button'), function(x){
    x.setAttribute('aria-pressed', String(x.dataset.v === val));
  });
}

function render(){
  document.getElementById('cv').width = W;
  document.getElementById('cv').height = H;
  var r = draw(state);
  var m = document.getElementById('meta');
  m.textContent = '1024 × 1536 · ' + (state.blank ? '空白模板' : ('已点亮 ' + r.done + ' / ' + r.total)) +
                  ' · 底图 ' + state.bg + ' · ' + (state.lang==='zh'?'中文':'English');
}

function download(name){
  var cv = document.getElementById('cv');
  cv.toBlob(function(blob){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  }, 'image/png');
}

loadAll().then(function(){
  bindSeg('segBg','bg');
  bindSeg('segStar','star');
  bindSeg('segLang','lang', function(){ setSeg('segLang', state.lang); });
  bindInput('nameInput','name');
  bindInput('dateInput','date');
  document.getElementById('todaySel').addEventListener('change', function(e){
    state.today = +e.target.value; render();
  });
  document.getElementById('btnDl').addEventListener('click', function(){
    download('stellar-weekly-' + state.date + '.png');
  });
  document.getElementById('btnBlank').addEventListener('click', function(){
    state.blank = true; render();
    download('stellar-weekly-blank.png');
    state.blank = false; render();
  });
  document.getElementById('btnCopy').addEventListener('click', function(){
    var cv = document.getElementById('cv');
    cv.toBlob(function(b){
      if (navigator.clipboard && window.ClipboardItem){
        navigator.clipboard.write([new ClipboardItem({'image/png': b})]).then(function(){
          var btn = document.getElementById('btnCopy');
          btn.textContent = '已复制 ✓';
          setTimeout(function(){ btn.textContent = '复制到剪贴板'; }, 1600);
        }).catch(function(){ alert('这个浏览器不支持复制图片，请用下载'); });
      } else { alert('这个浏览器不支持复制图片，请用下载'); }
    }, 'image/png');
  });
  render();
  document.body.dataset.ready = '1';
});
</script>
