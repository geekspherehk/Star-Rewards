<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成长打卡表 · Star-Rewards</title>
<style>
  :root{
    --brand:#5B5BD6;
    --brand-soft:#8B87E8;
    --accent:#F5A524;
    --ink:#2E2A47;
    --muted:#8B87A3;
    --line:#E8E4F0;
    --paper:#FFFDF8;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#EFEAF6}

  @page{ size:A4 portrait; margin:0 }

  body{
    font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }

  .sheet{
    width:210mm;
    min-height:297mm;
    margin:0 auto;
    padding:8mm 10mm 7mm;
    background:
      radial-gradient(circle at 1px 1px, #EDE7F6 1px, transparent 0) 0 0/9mm 9mm,
      var(--paper);
    display:flex;
    flex-direction:column;
    gap:4.4mm;
  }

  /* ---------- 页眉 ---------- */
  .head{
    position:relative;
    border-radius:6mm;
    padding:5.5mm 6mm 5mm;
    background:linear-gradient(135deg,#6C63D8 0%,#8B7BE8 45%,#B49BEA 100%);
    color:#fff;
    overflow:hidden;
    box-shadow:0 2mm 5mm rgba(107,99,216,.22);
  }
  .head::after{
    content:"";
    position:absolute;inset:0;
    background:
      radial-gradient(circle at 88% 18%, rgba(255,255,255,.30), transparent 42%),
      radial-gradient(circle at 12% 92%, rgba(255,255,255,.16), transparent 40%);
    pointer-events:none;
  }
  .ribbon{
    display:inline-block;
    background:rgba(255,255,255,.22);
    border:1px solid rgba(255,255,255,.45);
    color:#fff;
    font-size:3.1mm;font-weight:700;letter-spacing:.6mm;
    padding:1.1mm 5mm;border-radius:99px;
    margin-bottom:2.4mm;
  }
  h1{
    font-size:11.5mm;line-height:1.08;font-weight:800;letter-spacing:1mm;
    text-shadow:0 .5mm 1.2mm rgba(60,45,140,.28);
  }
  h1 .thin{font-weight:600;opacity:.92}
  .tagline{
    margin-top:2.2mm;font-size:3.5mm;font-weight:500;opacity:.94;letter-spacing:.3mm;
  }
  .hero-wrap{
    position:absolute;right:5mm;top:50%;transform:translateY(-50%);
    background:#fff;
    border-radius:5mm;
    padding:2.5mm;
    box-shadow:0 2mm 5mm rgba(60,45,140,.22);
    z-index:2;
  }
  .hero{
    display:block;height:38mm;width:auto;
  }
  .week-line{
    margin-top:3.4mm;
    display:flex;align-items:center;gap:2.6mm;
    font-size:3.4mm;font-weight:600;
  }
  .week-line .blank{
    display:inline-block;min-width:26mm;
    border-bottom:.5mm solid rgba(255,255,255,.75);
  }

  /* ---------- 表格 ---------- */
  .chart{
    background:var(--card);
    border-radius:5mm;
    padding:4mm 4mm 4.5mm;
    box-shadow:0 1mm 3mm rgba(80,60,140,.08);
    border:.35mm solid var(--line);
  }
  .chart-title{
    display:flex;align-items:center;gap:2.2mm;
    font-size:4.4mm;font-weight:800;color:var(--brand);
    margin-bottom:3mm;padding-left:1mm;
  }
  .chart-title .tag{
    font-size:2.9mm;font-weight:600;color:var(--muted);
    border-left:.4mm solid var(--line);padding-left:2.2mm;
  }

  .row{
    display:grid;
    grid-template-columns:58mm repeat(7,1fr) 20mm;
    align-items:stretch;
  }
  .row + .row{margin-top:1.8mm}

  .cell{
    border:.35mm solid var(--line);
    display:flex;align-items:center;justify-content:center;
  }

  /* 表头 */
  .head-row .cell{
    height:8.4mm;font-weight:800;font-size:3.5mm;color:#fff;border-color:transparent;
  }
  .head-row .lead{
    background:var(--brand);border-radius:3mm 0 0 3mm;
    justify-content:flex-start;padding-left:4mm;letter-spacing:.5mm;
  }
  .head-row .tail{background:var(--accent);border-radius:0 3mm 3mm 0}
  .d0{background:#F0A9C6}.d1{background:#F7C08A}.d2{background:#F2D57A}
  .d3{background:#9BD3A8}.d4{background:#9CC4EC}.d5{background:#B4A9EC}
  .d6{background:#EDA9D2}

  /* 方向格 */
  .lead{
    background:#FAF8FF;border-radius:3mm;
    gap:2.8mm;padding:0 3mm;justify-content:flex-start!important;
  }
  .lead img{width:11mm;height:11mm;flex:0 0 auto}
  .lead .tx{min-width:0}
  .lead .nm{font-size:3.9mm;font-weight:800;line-height:1.2}
  .lead .ds{
    font-size:2.7mm;color:var(--muted);font-weight:500;line-height:1.25;margin-top:.5mm;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* 打卡格 */
  .slot{height:13.4mm}
  .slot .st{width:10mm;height:10mm}
  .st{
    fill:#fff;
    stroke:#CFC8E4;
    stroke-width:1.5;
    stroke-linejoin:round;
  }
  .tail{background:#FFFCF3;border-radius:0 3mm 3mm 0}
  .tail .num{
    width:8mm;height:8mm;border-radius:2mm;
    border:.5mm dashed #F0C97A;background:#fff;
  }

  /* ---------- 底部 ---------- */
  .foot{display:grid;grid-template-columns:1fr 1fr;gap:4mm;flex:1}
  .box{
    background:var(--card);
    border:.35mm solid var(--line);
    border-radius:5mm;
    padding:4mm 4.5mm;
    display:flex;flex-direction:column;
    box-shadow:0 1mm 3mm rgba(80,60,140,.06);
  }
  .box h3{
    display:flex;align-items:center;gap:2mm;
    font-size:4mm;font-weight:800;color:var(--brand);
    margin-bottom:1mm;
  }
  .box .hint{font-size:2.9mm;color:var(--muted);font-weight:500;line-height:1.4}
  .pad{
    flex:1;margin-top:2.6mm;
    border:.5mm dashed #D9D2EA;border-radius:3.5mm;
    background:
      repeating-linear-gradient(180deg,transparent 0 8mm,#F4F1FA 8mm 8.4mm);
  }
  .stars{
    display:flex;gap:2.4mm;margin-top:3mm;justify-content:center;
  }
  .stars .st{width:8.5mm;height:8.5mm;stroke:#F0C97A}
  .slogan{
    text-align:center;
    font-size:3.4mm;font-weight:800;color:#fff;
    letter-spacing:1mm;
    background:linear-gradient(90deg,#8B87E8,#6C63D8);
    border-radius:99px;
    padding:2.2mm 0;
    box-shadow:0 1.2mm 3mm rgba(107,99,216,.2);
  }
  .slogan .st{
    fill:#FFE9A8;stroke:none;width:4.6mm;height:4.6mm;vertical-align:-.9mm;
  }

  /* 屏幕上的工具条 */
  .toolbar{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);
    display:flex;gap:8px;z-index:99;
  }
  .toolbar button{
    font:600 13px/1 -apple-system,"PingFang SC",sans-serif;
    padding:9px 16px;border-radius:99px;border:0;cursor:pointer;
    background:#5B5BD6;color:#fff;box-shadow:0 4px 14px rgba(91,91,214,.35);
  }
  .toolbar button.ghost{background:#fff;color:#5B5BD6;border:1.5px solid #D9D2EA;box-shadow:0 4px 14px rgba(80,60,140,.12)}
  @media print{
    .toolbar{display:none}
    html,body{background:#fff;height:auto}
    .sheet{margin:0;box-shadow:none;width:210mm;min-height:0}
  }
  @media screen{
    body{padding:0}
    .sheet{box-shadow:0 8mm 30mm rgba(80,60,140,.18);margin:20px auto}
  }
</style>
</head>
