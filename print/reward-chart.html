<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成长打卡表 · Star-Rewards</title>
<style>
  :root{
    --brand:#7A6FD0;
    --brand-deep:#5A4FB0;
    --accent:#F5A524;
    --ink:#4A3F63;
    --ink-soft:#8A7FA6;
    --line:#E3DAF0;
    --panel:rgba(255,253,250,.90);
    --cell:rgba(255,255,255,.72);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#EFE7F5}

  @page{ size:A4 portrait; margin:0 }

  body{
    font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }

  /* ============ A4 纸张：整幅插画铺底 ============ */
  .sheet{
    position:relative;
    width:210mm;height:297mm;
    margin:0 auto;overflow:hidden;
    background:#F7EEE8 url("../assets/print/chart-bg.png") center/100% 100% no-repeat;
  }

  /* 内容层：安全区（避开彩虹 / 物件栏 / 草地） */
  .stage{
    position:absolute;
    left:20mm;right:20mm;
    top:25mm;bottom:80mm;
    display:flex;flex-direction:column;gap:3mm;
  }

  /* ---------- 标题 ---------- */
  .head{text-align:center;flex:0 0 auto}
  .ribbon{
    display:inline-block;
    background:linear-gradient(90deg,#8B7BE8,#B49BEA);
    color:#fff;
    font-size:3mm;font-weight:700;letter-spacing:.8mm;
    padding:1.2mm 7mm;border-radius:99px;
    box-shadow:0 .8mm 2.4mm rgba(122,111,208,.28);
  }
  h1{
    margin-top:1.8mm;
    font-size:8.8mm;line-height:1.1;font-weight:700;letter-spacing:1.6mm;
    color:#5A4FB0;
    text-shadow:0 .3mm 0 #fff, 0 .8mm 2.6mm rgba(255,255,255,.95);
  }
  .tagline{
    margin-top:.8mm;
    display:inline-block;
    background:var(--panel);
    font-size:3.2mm;font-weight:600;color:var(--ink-soft);letter-spacing:.4mm;
    padding:.9mm 5mm;border-radius:99px;
  }
  .week-line{
    margin-top:2mm;
    display:flex;align-items:center;justify-content:center;gap:2.2mm;
    font-size:3.2mm;font-weight:700;color:#6B5FA8;
  }
  .week-line .blank{
    display:inline-block;min-width:24mm;
    border-bottom:.45mm solid #C9BEE4;
  }

  /* ---------- 表格：半透明面板 ---------- */
  .chart{
    flex:1 1 auto;
    background:var(--panel);
    border:.4mm solid rgba(255,255,255,.9);
    border-radius:6mm;
    padding:3.4mm 3.6mm;
    box-shadow:0 1.2mm 4mm rgba(122,90,150,.12);
    display:flex;flex-direction:column;
  }
  .chart-title{
    display:flex;align-items:center;gap:2mm;
    font-size:4mm;font-weight:800;color:var(--brand-deep);
    margin-bottom:2.4mm;padding-left:1.5mm;
  }
  .chart-title .tag{
    font-size:2.8mm;font-weight:600;color:var(--ink-soft);
    border-left:.4mm solid var(--line);padding-left:2mm;
  }
  .grid{flex:1 1 auto;display:flex;flex-direction:column;gap:1.3mm;min-height:0}

  .row{
    display:grid;
    grid-template-columns:42mm repeat(7,1fr) 16mm;
    gap:1.2mm;
    align-items:stretch;
  }
  .head-row .cell{
    height:7mm;font-weight:800;font-size:3mm;color:#fff;
    border:0;border-radius:2.4mm;
  }
  .head-row .lead{
    background:linear-gradient(135deg,#7A6FD0,#9B8AE8);
    border-radius:2.4mm 1mm 1mm 2.4mm;
    justify-content:flex-start;padding-left:3.5mm;letter-spacing:.4mm;
  }
  .head-row .tail{background:linear-gradient(135deg,#F0A020,#FFC46B);border-radius:1mm 2.4mm 2.4mm 1mm}
  .d0{background:#F49CB8}.d1{background:#F6B87E}.d2{background:#EFD06A}
  .d3{background:#8FCE9C}.d4{background:#8FBEE8}.d5{background:#A99BE8}
  .d6{background:#EFA0CE}

  .body-row{flex:1 1 0;min-height:0}
  .cell{border-radius:2.4mm;display:flex;align-items:center;justify-content:center}

  .lead{
    background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(246,240,255,.82));
    border:.35mm solid rgba(200,188,230,.5);
    gap:2.2mm;padding:0 2.6mm;justify-content:flex-start;
  }
  .lead img{width:7.8mm;height:7.8mm;flex:0 0 auto;border-radius:2mm}
  .lead .nm{font-size:3.5mm;font-weight:800;color:#5A4FB0;line-height:1.15}
  .lead .ds{font-size:2.4mm;color:var(--ink-soft);font-weight:500;line-height:1.2;margin-top:.3mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .slot{background:var(--cell);border:.35mm solid rgba(214,203,236,.75)}
  .slot .st{width:7.6mm;height:7.6mm}
  .st{fill:#fff;stroke:#C6B8E0;stroke-width:1.6;stroke-linejoin:round}

  .tail{background:rgba(255,249,236,.9);border:.4mm dashed #EFC172}

  /* ---------- 底部 ---------- */
  .foot{display:grid;grid-template-columns:1fr 1fr;gap:3.6mm;flex:0 0 auto}
  .box{
    background:var(--panel);
    border:.4mm solid rgba(255,255,255,.9);
    border-radius:5mm;
    padding:2.4mm 3.2mm 2.8mm;
    box-shadow:0 1mm 3mm rgba(122,90,150,.10);
  }
  .box h3{display:flex;align-items:center;gap:1.8mm;font-size:3.5mm;font-weight:800;color:var(--brand-deep)}
  .box .hint{font-size:2.6mm;color:var(--ink-soft);font-weight:500;margin-top:.6mm}
  .pad{
    margin-top:1.6mm;height:8mm;
    border:.45mm dashed #D6CBE9;border-radius:2.6mm;
    background:repeating-linear-gradient(180deg,transparent 0 5.6mm,rgba(226,216,242,.5) 5.6mm 5.9mm);
  }
  .stars{display:flex;gap:2mm;margin-top:1.8mm;justify-content:center}
  .stars .st{width:6.6mm;height:6.6mm;stroke:#EFC172;fill:#FFFBF0}

  .slogan{
    flex:0 0 auto;text-align:center;
    font-size:3.1mm;font-weight:800;color:#fff;letter-spacing:1mm;
    background:linear-gradient(90deg,#9B8AE8,#7A6FD0);
    border-radius:99px;padding:1.9mm 0;
    box-shadow:0 1mm 2.6mm rgba(122,111,208,.26);
  }
  .slogan .st{fill:#FFE9A8;stroke:none;width:4.2mm;height:4.2mm;vertical-align:-.8mm}

  .toolbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:99}
  .toolbar button{
    font:600 13px/1 -apple-system,"PingFang SC",sans-serif;
    padding:9px 16px;border-radius:99px;border:0;cursor:pointer;
    background:#5A4FB0;color:#fff;box-shadow:0 4px 14px rgba(90,79,176,.35);
  }
  @media print{ .toolbar{display:none} }
  @media screen{ .sheet{box-shadow:0 8mm 30mm rgba(90,60,140,.22);margin:20px auto} }
</style>
</head>
<body>

<div class="toolbar no-print">
  <button onclick="window.print()">打印 / 存为 PDF</button>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

        <div class="cell slot"><svg class="st"><use href="#star"/></svg></div>
