<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>今天能亮哪一朵</title>
<link rel="manifest" href="manifest-kid.json">
<meta name="theme-color" content="#4C6FFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今天">
<meta name="description" content="孩子自己按一下，亮一朵花。">
<!-- 图标：PWA 装桌面走 manifest，但「Chrome 添加到主屏幕」的老路径和 iOS 只认下面这两个 link。
     缺了它们 Chrome 会给一个默认小地球，家长在桌面根本认不出这是那个 app（2026-10-03 踩的） -->
<link rel="icon" type="image/png" href="assets/kid-icon-192.png">
<link rel="apple-touch-icon" href="assets/kid-icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="assets/kid-icon-512.png">
<link rel="stylesheet" href="style.css?v=108">
<style>
  /* 孩子端：只有「看得见 / 亮得了 / 换得出」。不催、不提醒、不留小红点。 */
  .kid-wrap{min-height:100vh;padding:14px 16px 26px;display:flex;flex-direction:column;gap:14px;background:var(--surface,#fff);color:var(--text,#1a1a1a)}
  .kid-title{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
  .kid-points{margin-left:auto;font-size:15px;font-weight:700;color:var(--accent,#F0A500)}
  .kid-grid{display:flex;flex-wrap:wrap;gap:12px}
  .kid-flower{flex:1 1 44%;min-width:150px;aspect-ratio:1/1;border:3px solid var(--border,#E4E7EC);border-radius:26px;
    background:var(--surface,#fff);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s ease, border-color .2s ease}
  .kid-flower:active{transform:scale(.96)}
  /* 图标用现成贴纸（256×256 带圆角底），不用 emoji：🪥 牙刷是 Unicode 13，老 Android 会出豆腐块 */
  .kid-flower .glyph{width:58px;height:58px;border-radius:16px;overflow:hidden;background:var(--surface,#fff)}
  .kid-flower .glyph img{width:100%;height:100%;display:block}
  .kid-flower .lbl{font-size:15px;font-weight:700;padding:0 6px;text-align:center}
  .kid-flower.lit{border-color:var(--brand,#4C6FFF);background:linear-gradient(160deg,#EDF2FF,#F7F9FF)}
  .kid-flower.lit .glyph{box-shadow:0 2px 6px rgba(76,111,255,.3)}
  .kid-flower{position:relative}
  .kid-flower.lit::after{content:"";position:absolute;top:9px;right:11px;width:20px;height:20px;
    background:var(--brand,#4C6FFF);border-radius:50%;
    -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6 9 17l-5-5'/></svg>") center/contain no-repeat;
    mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6 9 17l-5-5'/></svg>") center/contain no-repeat}
  .kid-sep{font-size:14px;font-weight:700;opacity:.55;margin-top:2px}
  .kid-gift{flex:1 1 46%;min-width:160px;display:flex;align-items:center;gap:10px;padding:14px;border:3px solid var(--border,#E4E7EC);
    border-radius:20px;background:var(--surface,#fff);text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .kid-gift:active{transform:scale(.97)}
  .kid-gift .gname{font-size:15px;font-weight:700;flex:1}
  .kid-gift .gpts{font-size:14px;font-weight:800;color:var(--accent,#F0A500)}
  .kid-gift[disabled]{opacity:.45}
  .kid-note{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--border,#E4E7EC)}
  .kid-note input{flex:1;font-size:16px;padding:10px 12px;border-radius:14px;border:2px solid var(--border,#E4E7EC);background:var(--surface,#fff)}
  .kid-note button{width:auto;padding:10px 16px;border-radius:14px;border:0;background:var(--brand,#4C6FFF);color:#fff;font-weight:800;font-size:15px}
  /* 反馈语要贴着输入框（gap:14px 会把提示甩到远处） */
  .kid-msg{font-size:14px;font-weight:700;min-height:20px;margin-top:-7px}
  .kid-msg.ok{color:var(--brand,#4C6FFF)}
  .kid-msg.err{color:#D93025}
  .kid-empty{font-size:15px;opacity:.6}
  .kid-go{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:100vh;text-align:center;padding:24px}
  /* 同类选择器会盖掉 [hidden] 的 display:none，不补这条「正在打开…」永远收不掉 */
  .kid-go[hidden]{display:none}
  .kid-go .big svg{width:76px;height:76px;color:var(--accent,#F0A500)}
  .kid-note .mic{flex:none;display:flex;color:var(--brand,#4C6FFF)}
  /* 装桌面图标的引导：只在第一次拿链接那一下出现，装好自动收掉 */
  .kid-help{margin-top:10px;padding:12px 14px;border:2px dashed var(--border,#E4E7EC);border-radius:18px;background:var(--surface,#fff);text-align:left}
  .kid-help h4{margin:0 0 6px;font-size:14px;font-weight:800}
  .kid-help ol{margin:0;padding-left:18px;font-size:13px;line-height:1.65;opacity:.8}
  .kid-install{width:auto;margin-top:10px;padding:9px 18px;border:0;border-radius:14px;background:var(--brand,#4C6FFF);color:#fff;font-weight:800;font-size:15px}
  .kid-install[hidden]{display:none}
</style>
</head>
<body>
<div id="app" class="kid-wrap" hidden>
  <div class="kid-title"><span id="childName">今天</span><span class="kid-points">⭐ <span id="points">0</span></span></div>
  <div id="flowers" class="kid-grid"></div>
  <div id="giftsWrap" hidden>
    <div class="kid-sep">我能换</div>
    <div id="gifts" class="kid-grid"></div>
  </div>
  <div class="kid-note">
    <span class="mic" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="9" y="2" width="6" height="11" rx="3"></rect>
        <path d="M5 10a7 7 0 0 0 14 0M12 17v5M8.5 22h7"></path>
      </svg>
    </span>
    <input id="say" type="text" inputmode="text" placeholder="想说啥就说一句" autocomplete="off">
    <button id="sayBtn" type="button">存下</button>
  </div>
  <div id="msg" class="kid-msg"></div>
  <div id="kidHelp" class="kid-help" hidden>
    <h4>把这个变成平板桌面上的一个图标</h4>
    <button type="button" class="kid-install" id="kidInstall" hidden>装到桌面</button>
    <ol id="kidHelpSteps">
      <li>点右上角 ⋮ →「安装应用」；装完 ⋮ →「应用」里能看到「今天」，就说明装上了</li>
      <li>桌面还找不到：长按桌面空白处 →「添加到主屏幕」，补一个短图标（这条一定有）</li>
      <li>小米 / 华为 / OPPO：图标可能先落在「应用抽屉」，上滑翻一翻；再不行就用手机<b>自带浏览器</b>打开这个链接 → 菜单 →「添加到桌面」</li>
    </ol>
  </div>
</div>

<div id="boot" class="kid-go">
  <div class="big">
    <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <g stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
        <path d="M32 32c0-9 6-16 13-16 4 0 6 3 6 7 0 5-5 9-11 9"></path>
        <path d="M32 32c0-9-6-16-13-16-4 0-6 3-6 7 0 5 5 9 11 9"></path>
        <path d="M32 32c9 0 16 6 16 13 0 4-3 6-7 6-5 0-9-5-9-11"></path>
        <path d="M32 32c9 0 16-6 16-13 0-4-3-6-7-6-5 0-9 5-9 11"></path>
      </g>
      <circle cx="32" cy="32" r="6" fill="currentColor"></circle>
    </svg>
  </div>
  <div id="bootMsg" style="font-size:17px;font-weight:700">正在打开…</div>
</div>

<script>
(function () {
  'use strict';
  var TOKEN_KEY = 'kid_token';
  var token = localStorage.getItem(TOKEN_KEY) || '';
  var params = new URLSearchParams(location.search);

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function say(msg, ok) {
    var el = document.getElementById('msg');
    el.textContent = msg || '';
    el.className = 'kid-msg ' + (ok ? 'ok' : 'err');
  }
  async function call(action, payload) {
    var res = await fetch('api/index.php?action=' + encodeURIComponent(action), {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}),
      body: JSON.stringify(payload || {})
    });
    var json = null;
    try { json = await res.json(); } catch (e) {}
    if (!res.ok) {
      var err = new Error((json && json.error) || ('HTTP ' + res.status));
      err.code = res.status;
      throw err;
    }
    return json;
  }

  var ICONS = ['assets/weekly/icon-brush.png', 'assets/weekly/icon-bag.png',
    'assets/weekly/icon-water.png', 'assets/weekly/icon-moon.png',
    'assets/weekly/icon-ball.png', 'assets/weekly/icon-book.png',
    'assets/weekly/icon-heart.png', 'assets/weekly/icon-plant.png'];

  async function boot() {
    // 还没换过会话 + 地址带着一次性长链接 = 家长正在娃平板上第一次打开，
    // 这时才该教怎么装图标；之后娃自己按，不摆说明书。
    if (params.get('k') && !isRunningAsApp()) {
      if (help) help.hidden = false;
    }
    // 1) 还没换过会话：地址带一次性长链接 → 换回孩子会话
    if (!token) {
      var code = params.get('k') || '';
      if (!code) {
        document.getElementById('bootMsg').textContent = '这个页面要先让大人给一次链接。';
        return;
      }
      var r = await call('redeem_kid_link', { k: code });
      if (!r || !r.token) throw new Error('链接无效');
      token = r.token;
      localStorage.setItem(TOKEN_KEY, token);
      // 把一次性码从地址里抹掉，避免留在历史记录里
      try {
        history.replaceState(null, '', location.pathname);
      } catch (e) {}
    }
    await load();
  }

  async function load() {
    var data = await call('kid_status', {});
    if (!data || !data.success) throw new Error('加载失败');
    document.getElementById('childName').textContent = '今天能亮哪一朵';
    document.getElementById('points').textContent = data.current_points;

    var wrap = document.getElementById('flowers');
    if (!data.flowers || !data.flowers.length) {
      wrap.innerHTML = '<div class="kid-empty">还没有可以亮的花</div>';
    } else {
      wrap.innerHTML = data.flowers.map(function (f, i) {
        var ic = ICONS[i % ICONS.length];
        return '<button type="button" class="kid-flower' + (f.done ? ' lit' : '') + '" data-id="' + f.wish_id + '">' +
          '<span class="glyph"><img src="' + ic + '" alt="" loading="lazy"></span>' +
          '<span class="lbl">' + esc(f.title) + '</span></button>';
      }).join('');
      Array.prototype.forEach.call(document.querySelectorAll('.kid-flower'), function (el) {
        el.addEventListener('click', function () { onFlower(el); });
      });
    }

    if (data.gifts && data.gifts.length) {
      document.getElementById('giftsWrap').hidden = false;
      document.getElementById('gifts').innerHTML = data.gifts.map(function (g) {
        var afford = data.current_points >= g.points;
        return '<button type="button" class="kid-gift" data-id="' + g.id + '"' + (afford ? '' : ' disabled') + '>' +
          '<span class="gname">' + esc(g.name) + '</span><span class="gpts">⭐' + g.points + '</span></button>';
      }).join('');
      Array.prototype.forEach.call(document.querySelectorAll('.kid-gift'), function (el) {
        el.addEventListener('click', function () { onGift(el); });
      });
    }
    document.getElementById('app').hidden = false;
    document.getElementById('boot').hidden = true;
  }

  async function onFlower(el) {
    if (el.classList.contains('lit')) return; // 一天只亮一次
    try {
      var r = await call('kid_checkin', { wish_id: parseInt(el.dataset.id, 10) });
      el.classList.add('lit');
      document.getElementById('points').textContent = r.current_points;
      say('亮了！继续', true);
    } catch (e) {
      // 重复/失败都不打断：娃只当这一下没按成
      say(e.message || '没亮成', false);
    }
  }

  async function onGift(el) {
    if (el.disabled) return;
    try {
      var r = await call('kid_redeem', { gift_id: parseInt(el.dataset.id, 10) });
      document.getElementById('points').textContent = r.current_points;
      say('换好啦：' + r.redeemed_gift.name, true);
      // 点数变了，「换得起 / 还差几颗」要跟着重算
      await load();
    } catch (e) {
      say(e.message || '没换成', false);
    }
  }

  document.getElementById('sayBtn').addEventListener('click', async function () {
    var input = document.getElementById('say');
    var text = (input.value || '').trim();
    if (!text) return;
    try {
      await call('kid_say', { content: text });
      input.value = '';
      say('存下啦', true);
    } catch (e) {
      say(e.message || '没存成', false);
    }
  });

  // 装桌面图标：Chrome 会给 beforeinstallprompt，能直接一键装（比家长自己找菜单稳）。
  // 「安装应用」点了却桌面上没有图标 → 是启动器的事，页面里给指路，不装糊涂。
  var deferredPrompt = null;
  var help = document.getElementById('kidHelp');
  var installBtn = document.getElementById('kidInstall');

  // 从桌面图标进来 → standalone；这时别再摆一张「怎么装」的卡给孩子看
  function isRunningAsApp() {
    if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
    if (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) return true;
    return !!navigator.standalone;
  }

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    if (installBtn) installBtn.hidden = false;
  });
  window.addEventListener('appinstalled', function () {
    deferredPrompt = null;
    if (installBtn) installBtn.hidden = true;
    var steps = document.getElementById('kidHelpSteps');
    if (steps) steps.innerHTML = '<li>装好啦。桌面上会有个「今天」的图标，点开就是全屏的花卡。</li>';
  });
  if (installBtn) {
    installBtn.addEventListener('click', async function () {
      if (!deferredPrompt) return;
      installBtn.hidden = true;
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      deferredPrompt = null;
      if (choice && choice.outcome !== 'accepted') {
        installBtn.hidden = false; // 娃/家长取消了，还在这一页，别装作没发生
      }
    });
  }

  // 装 PWA 的前置：安卓 Chrome 只认「有 manifest + 有 Service Worker」的站点，
  // 脚本地址必须与 pwa-manager.js 里的完全一致，否则同一 scope 会挂两个 SW 抢 fetch。
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js?v=147').catch(function (e) {
      console.warn('kid SW 注册失败', e);
    });
  }

  boot().catch(function (e) {
    var m = e && e.message ? e.message : '打不开';
    // 旧平板：家长改过链接 → 清掉失效会话，回到"要新链接"的提示
    if (e.code === 403 || /reset|not valid/i.test(m)) {
      localStorage.removeItem(TOKEN_KEY);
      document.getElementById('bootMsg').textContent = '这台设备已经不能用了，让大人再给一次新链接。';
    } else {
      document.getElementById('bootMsg').textContent = m;
    }
  });
})();
</script>
</body>
</html>
