<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Star Rewards 儿童积分奖励系统</title>
    <meta name="description" content="登录 Star Rewards 积分奖励系统，继续记录孩子的成长行为、管理愿望清单和积分兑换。">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://stellar.gaocaihk.com/login.html">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="logo.svg">
    <meta property="og:title" content="Star Rewards 儿童积分奖励系统 - 行为管理、习惯养成工具">
    <meta property="og:description" content="用积分激励孩子养成好习惯：行为记录、愿望清单、积分兑换，内置丰富行为奖励模板。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://stellar.gaocaihk.com/login.html">
    <meta property="og:image" content="https://stellar.gaocaihk.com/og-image.png">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="style.css?v=92">
    <meta name="theme-color" content="#6C5CE7">
    <!-- API Client for Hostinger MySQL -->
    <script defer src="api/api-client.js?v=30"></script>
    <!-- 多语言支持 -->
    <script defer src="i18n.js?v=83"></script>
    <script defer src="utils.js?v=1"></script>
    <script>
        // 页面加载日志
        console.log('login.html页面开始加载...');
        window.addEventListener('load', function() {
            console.log('login.html页面加载完成');
            initLanguage();
        });
    </script>
    <style>
        .auth-tabs{display:flex;gap:10px;max-width:340px;margin:0 auto 18px;}
        .auth-tab{flex:1;padding:11px 0;border:1.5px solid var(--brand,#6C5CE7);background:transparent;color:var(--brand,#6C5CE7);border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:.15s;}
        .auth-tab.active{background:var(--brand,#6C5CE7);color:#fff;}
        .auth-hint{font-size:13px;color:var(--text-2,#8a8a92);margin:12px 0 0;text-align:center;}
        .auth-hint a{color:var(--brand,#6C5CE7);font-weight:600;text-decoration:none;}
    </style>
</head>
<body>
    <header class="app-topbar">
        <div class="topbar-inner">
            <div class="brand">
                <img src="logo.svg" alt="Star Rewards" class="brand-logo">
                <span class="brand-name">Star Rewards</span>
            </div>
            <div class="topbar-actions">
                <select id="language-selector" class="lang-select" onchange="setLanguage(this.value)">
                    <option value="zh">中文</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>
    </header>

    <div class="container">
        <h1>Star Rewards</h1>
        <p style="text-align:center; margin:-6px 0 14px; font-size:13px;"><a href="landing.html" style="color:var(--brand,#6C5CE7); text-decoration:none;" data-i18n="land.navFeatures">功能</a> · <a href="landing.html#faq" style="color:var(--brand,#6C5CE7); text-decoration:none;" data-i18n="land.navFaq">常见问题</a> · <span style="color:var(--text-2,#8a8a92);" data-i18n="land.freeBanner">现在完全免费</span></p>

        <!-- 用户认证区域 -->
        <div id="auth-section">
            <div class="auth-tabs" id="auth-tabs">
                <button type="button" class="auth-tab active" data-form="register" onclick="switchAuthTab('register')" data-i18n="common.registerTab">注册</button>
                <button type="button" class="auth-tab" data-form="login" onclick="switchAuthTab('login')" data-i18n="common.loginTab">登录</button>
            </div>
            <div id="auth-forms">
                <!-- 注册表单（默认显示） -->
                <div id="register-form" class="auth-form">
                    <h3><span data-i18n="login.registerButton">用户注册</span></h3>
                    <input type="email" id="register-email" data-i18n-placeholder="login.emailPlaceholder" placeholder="邮箱地址">
                    <input type="password" id="register-password" data-i18n-placeholder="login.passwordPlaceholder" placeholder="密码（至少6位）">
                    <input type="text" id="register-invite" maxlength="6" style="text-transform:uppercase" data-i18n-placeholder="login.invitePlaceholder" placeholder="邀请码（可选）">
                    <label class="consent-label" for="register-consent">
                        <input type="checkbox" id="register-consent">
                        <span data-i18n="common.consentText">我确认我是该儿童账号的监护人，并同意 Star Rewards 收集并使用相关成长数据以提供本服务</span>
                    </label>
                    <button onclick="handleSignUp()" data-i18n="login.registerButton">注册</button>
                    <p><span data-i18n="common.hasAccount">已有账户？</span><a href="#" onclick="switchAuthTab('login')" data-i18n="common.loginNow">立即登录</a></p>
                </div>

                <!-- 登录表单 -->
                <div id="login-form" class="auth-form" style="display:none;">
                    <h3><span data-i18n="login.title">用户登录</span></h3>
                    <input type="email" id="login-email" data-i18n-placeholder="login.emailPlaceholder" placeholder="邮箱地址">
                    <input type="password" id="login-password" data-i18n-placeholder="login.passwordPlaceholder" placeholder="密码">
                    <p style="text-align:right; margin:-4px 0 10px; font-size:13px;"><a href="#" onclick="toggleAuthForm('forgot')" style="color:var(--brand,#6C5CE7); text-decoration:none;" data-i18n="login.forgotLink">忘记密码？</a></p>
                    <button onclick="handleSignIn()" data-i18n="login.loginButton">登录</button>
                    <p id="login-hint" class="auth-hint" style="display:none;"><span data-i18n="common.authNoAccountHint">该邮箱尚未注册？</span> <a href="#" onclick="switchAuthTab('register');return false;" data-i18n="common.registerNow">立即注册</a></p>
                    <p><span data-i18n="common.noAccount">还没有账户？</span><a href="#" onclick="switchAuthTab('register')" data-i18n="common.registerNow">立即注册</a></p>
                </div>

                <!-- 忘记密码表单：输入邮箱 → 发重置链接 -->
                <div id="forgot-form" class="auth-form" style="display: none;">
                    <h3><span data-i18n="login.forgotTitle">找回密码</span></h3>
                    <p style="font-size:13px; color:var(--text-2,#8a8a92); margin:0 0 12px;" data-i18n="login.forgotLead">输入注册邮箱，我们会发送重置链接（30 分钟内有效）。</p>
                    <input type="email" id="forgot-email" data-i18n-placeholder="login.emailPlaceholder" placeholder="邮箱地址">
                    <button onclick="handleForgotPassword()" data-i18n="login.forgotSubmit">发送重置链接</button>
                    <p><a href="#" onclick="toggleAuthForm('login')" data-i18n="login.backToLogin">返回登录</a></p>
                </div>

                <!-- 重置密码表单：从邮件链接 ?reset=TOKEN 进入 -->
                <div id="reset-form" class="auth-form" style="display: none;">
                    <h3><span data-i18n="login.resetTitle">设置新密码</span></h3>
                    <input type="password" id="reset-password" data-i18n-placeholder="login.newPasswordPlaceholder" placeholder="新密码（至少6位）">
                    <input type="password" id="reset-password2" data-i18n-placeholder="login.confirmPasswordPlaceholder" placeholder="再输入一次新密码">
                    <button onclick="handleResetPassword()" data-i18n="login.resetSubmit">重置密码</button>
                </div>
            </div>
        </div>
    </div>
    
    <script defer src="login.js?v=15"></script>
    <script defer src="pwa-manager.js?v=2"></script>
</body>
</html>
