<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Me - 登录</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="i18n.css">
    <!-- Supabase SDK -->
    <script src="supabase.min.js"></script>
    <!-- 多语言支持 -->
    <script src="i18n.js?v=6"></script>
    <script>
        // 页面加载日志
        console.log('login.html页面开始加载...');
        window.addEventListener('load', function() {
            console.log('login.html页面加载完成');
            initLanguage();
        });
    </script>
</head>
<body>
    <div class="language-selector">
        <select id="language-selector" onchange="setLanguage(this.value)">
            <option value="zh">中文</option>
            <option value="en">English</option>
        </select>
    </div>
    
    <div class="container">
        <h1>🌟 Best Me</h1>
        
        <!-- 用户认证区域 -->
        <div id="auth-section">
            <div id="auth-forms">
                <!-- 登录表单 -->
                <div id="login-form" class="auth-form">
                    <h3>🔐 <span data-i18n="login.title">用户登录</span></h3>
                    <input type="email" id="login-email" data-i18n-placeholder="login.emailPlaceholder" placeholder="邮箱地址">
                    <input type="password" id="login-password" data-i18n-placeholder="login.passwordPlaceholder" placeholder="密码">
                    <button onclick="handleSignIn()" data-i18n="login.loginButton">登录</button>
                    <p><span data-i18n="common.noAccount">还没有账户？</span><a href="#" onclick="toggleAuthForm('register')" data-i18n="common.registerNow">立即注册</a></p>
                    <p style="font-size: 12px; margin-top: 10px;">
                        <a href="#" onclick="handleResendConfirmation()" style="color: #2196F3;" data-i18n="common.resendConfirmation">未收到确认邮件？重新发送</a>
                    </p>
                </div>
                
                <!-- 注册表单 -->
                <div id="register-form" class="auth-form" style="display: none;">
                    <h3>📝 <span data-i18n="login.registerButton">用户注册</span></h3>
                    <input type="email" id="register-email" data-i18n-placeholder="login.emailPlaceholder" placeholder="邮箱地址">
                    <input type="password" id="register-password" data-i18n-placeholder="login.passwordPlaceholder" placeholder="密码（至少6位）">
                    <button onclick="handleSignUp()" data-i18n="login.registerButton">注册</button>
                    <p><span data-i18n="common.hasAccount">已有账户？</span><a href="#" onclick="toggleAuthForm('login')" data-i18n="common.loginNow">立即登录</a></p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="login.js"></script>
</body>
</html>
